version : "2"
sql:
  - engine : postgresql
    queries: internal/database/sql/queries
    schema: internal/database/sql/migrations
    gen:
      go :
        package: postgres
        out: internal/database/postgres
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: UUID
            go_type: github.com/google/uuid.UUID
          - db_type: TIMESTAMPZ
            go_type: time.Time
