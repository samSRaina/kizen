version : "2"
sql:
  - engine : postgresql
    queries: sql/queries/workspaces.sql
    schema: sql/migrations
    gen:
      go :
        package: database
        out: "services/server/internal/workspace/database"
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestampz
            go_type: time.Time

  - engine : postgresql
    queries: sql/queries/tickets.sql
    schema: sql/migrations
    gen:
      go :
        package: database
        out: "services/server/internal/ticket/database"
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestampz
            go_type: time.Time
