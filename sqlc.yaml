version : "2"
sql:
  - engine : postgresql
    queries: sql/queries
    schema: sql/migrations
    gen:
      go :
        package: gen
        out: "internal/repository/postgres/gen"
        sql_package: pgx/v5
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestampz
            go_type: time.Time
