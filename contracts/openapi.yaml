openapi: 3.1.0
info:
  title: Kizen API
  version: 1.0.0
  description: Single-tenant freelance project manager and time-tracker.
  contact:
    name: samRaina
servers:
- url: http://localhost/api/v1
  description: Localhost developement
paths:
  /ws:
    get:
      tags:
      - Workspaces
      summary: List all workspaces for the authenticated user
      operationId: listWorkspaces
      security:
      - bearerAuth: []
      responses:
        '200':
          description: A list of workspaces owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Workspaces
      summary: Create a new workspace
      operationId: createWorkspace
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: 'Created. The response is the complete workspace. Including the server-assiged identifier, and expanded summaries.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws/{id}:
    get:
      tags:
      - Workspaces
      summary: Get a workspace by id
      operationId: getWorkspace
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Workspaces
      summary: Update a workspace
      operationId: updateWorkspace
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Workspaces
      summary: Delete a workspace by id
      operationId: deleteWorkspace
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The workspace was successfully deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws/{workspace_id}/p:
    get:
      tags:
      - Projects
      summary: List projects for a workspace
      operationId: listProjects
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Projects
      summary: Create a new project
      operationId: createProject
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws/{workspace_id}/p/{project_id}:
    get:
      tags:
      - Projects
      summary: Get a project by id
      operationId: getProject
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Projects
      summary: Update a project
      operationId: updateProject
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Projects
      summary: Delete a project
      operationId: deleteProject
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The project was successfully deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws/{workspace_id}/p/{project_id}/tickets:
    get:
      tags:
      - Tickets
      summary: List tickets for a project
      operationId: listTickets
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A list of tickets for the project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Tickets
      summary: Create a new ticket under a project
      operationId: createTicket
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws/{workspace_id}/p/{project_id}/tickets/{identifier}:
    get:
      tags:
      - Tickets
      summary: Get a ticket by identifier in a project
      operationId: getTicket
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Tickets
      summary: Update a ticket in a project
      operationId: updateTicket
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Tickets
      summary: Delete a ticket in a project
      operationId: deleteTicket
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Ticket successfully deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws/{workspace_id}/track:
    get:
      tags:
      - Track
      summary: List time entries for a workspace
      operationId: listTracks
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ticket_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A list of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Track
      summary: Create or start a time entry
      description: Create a completed time entry with duration or start an active timer (ended_at omitted). Starting a new timer automatically stops any existing active timer.
      operationId: createTrack
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrackRequest'
      responses:
        '201':
          description: Created time entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws/{workspace_id}/track/{id}:
    get:
      tags:
      - Track
      summary: Get a time entry by id
      operationId: getTrack
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The time entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Track
      summary: Update a time entry
      operationId: updateTrack
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrackRequest'
      responses:
        '200':
          description: Updated time entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Track
      summary: Delete a time entry
      operationId: deleteTrack
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Time entry successfully deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws/{workspace_id}/track/{id}/stop:
    post:
      tags:
      - Track
      summary: Stop an active time entry timer
      operationId: stopTrack
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Stopped time entry with calculated duration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws/{workspace_id}/track/{id}/pause:
    post:
      tags:
      - Track
      summary: Pause an active running time entry timer
      operationId: pauseTrack
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paused time entry with accrued duration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws/{workspace_id}/track/{id}/resume:
    post:
      tags:
      - Track
      summary: Resume a paused time entry timer
      operationId: resumeTrack
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Resumed live running time entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Workspace:
      type: object
      required:
      - id
      - owner_id
      - name
      - default_hourly_rate
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
        name:
          type: string
        default_hourly_rate:
          type: integer
          description: baseline rate
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateWorkspaceRequest:
      type: object
      required:
      - name
      - default_hourly_rate
      properties:
        name:
          type: string
          minLength: 1
        default_hourly_rate:
          type: integer
          minimum: 0
        description:
          type: string
          nullable: true
    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        default_hourly_rate:
          type: integer
          minimum: 0
        description:
          type: string
          nullable: true
    Project:
      type: object
      required:
      - id
      - workspace_id
      - name
      - ticket_id_prefix
      - settings
      - default_hourly_rate
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
          example: Frontend App
        ticket_id_prefix:
          type: string
          example: FRONT
        settings:
          type: object
          additionalProperties: true
        default_hourly_rate:
          type: integer
          example: 85
        description:
          type: string
          nullable: true
          example: Client project description
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: Frontend App
        ticket_id_prefix:
          type: string
          example: FRONT
        default_hourly_rate:
          type: integer
          example: 85
        description:
          type: string
          nullable: true
        settings:
          type: object
          additionalProperties: true
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        ticket_id_prefix:
          type: string
        default_hourly_rate:
          type: integer
        description:
          type: string
          nullable: true
        settings:
          type: object
          additionalProperties: true
    ProblemDetail:
      type: object
      description: 'RFC 7807 Problem Details. The error shape for every non-2xx response in the API. `type` names the error class; `errors` (validation only) maps field names to human-readable messages.'
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem.
      additionalProperties: true
    TicketStatus:
      type: string
      enum:
      - backlog
      - todo
      - progress
      - review
      - done
    TicketPriority:
      type: string
      enum:
      - Critical
      - High
      - Medium
      - Low
    TicketType:
      type: string
      enum:
      - feature
      - bug
      - task
    Ticket:
      type: object
      required:
      - id
      - project_id
      - identifier
      - title
      - type
      - priority
      - status
      - points
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        identifier:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/TicketType'
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        points:
          type: integer
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTicketRequest:
      type: object
      required:
      - title
      - type
      - priority
      properties:
        project_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        description:
          type: string
        type:
          $ref: '#/components/schemas/TicketType'
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        points:
          type: integer
          minimum: 0
        tags:
          type: array
          items:
            type: string
    UpdateTicketRequest:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        description:
          type: string
        type:
          $ref: '#/components/schemas/TicketType'
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        points:
          type: integer
          minimum: 0
        tags:
          type: array
          items:
            type: string
    Track:
      type: object
      required:
      - id
      - workspace_id
      - started_at
      - billable
