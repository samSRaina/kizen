openapi: 3.1.0
info:
  title: Kizen API
  version: 1.0.0
  description: Single-tenant freelance project manager and time-tracker.
  contact:
    name: samRaina
servers:
- url: http://localhost/api/v1
  description: Localhost developement
paths:
  /workspaces:
    get:
      tags:
      - Workspaces
      summary: List all workspaces for the authenticated user
      operationId: listWorkspaces
      security:
      - bearerAuth: []
      responses:
        '200':
          description: A list of workspaces owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Workspaces
      summary: Create a new workspace
      operationId: createWorkspace
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: 'Created. The response is the complete workspace. Including
            the

            server-assiged identifier, and expanded summaries.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /workspaces/{id}:
    delete:
      tags:
      - Workspaces
      summary: Delete a workspace by id
      operationId: deleteWorkspace
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The workspace was successfully deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /workspaces/{workspace_id}/tickets:
    get:
      tags:
      - Tickets
      summary: List tickets for a workspace
      operationId: listTickets
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A list of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Tickets
      summary: Create a new ticket
      operationId: createTicket
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /workspaces/{workspace_id}/tickets/{identifier}:
    get:
      tags:
      - Tickets
      summary: Get a ticket by identifier
      operationId: getTicket
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Tickets
      summary: Update a ticket
      operationId: updateTicket
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Tickets
      summary: Delete a ticket
      operationId: deleteTicket
      security:
      - bearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Ticket successfully deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Workspace:
      type: object
      required:
      - id
      - owner_id
      - name
      - default_hourly_rate
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
        name:
          type: string
        default_hourly_rate:
          type: integer
          description: baseline rate
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateWorkspaceRequest:
      type: object
      required:
      - name
      - default_hourly_rate
      properties:
        name:
          type: string
          minLength: 1
        default_hourly_rate:
          type: integer
          minimum: 0
        description:
          type: string
          nullable: true
    ProblemDetail:
      type: object
      description: 'RFC 7807 Problem Details. The error shape for every non-2xx response

        in the API. `type` names the error class; `errors` (validation only)

        maps field names to human-readable messages.

        '
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem.
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of
            the problem.
      additionalProperties: true
    TicketStatus:
      type: string
      enum:
      - backlog
      - todo
      - progress
      - review
      - done
    TicketPriority:
      type: string
      enum:
      - Critical
      - High
      - Medium
      - Low
    TicketType:
      type: string
      enum:
      - feature
      - bug
      - task
    Ticket:
      type: object
      required:
      - id
      - workspace_id
      - identifier
      - title
      - type
      - priority
      - status
      - points
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        identifier:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/TicketType'
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        points:
          type: integer
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTicketRequest:
      type: object
      required:
      - title
      - type
      - priority
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        type:
          $ref: '#/components/schemas/TicketType'
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        points:
          type: integer
          minimum: 0
        assignee_id:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
    UpdateTicketRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        type:
          $ref: '#/components/schemas/TicketType'
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        points:
          type: integer
          minimum: 0
        assignee_id:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
  responses:
    BadRequest:
      description: 'Malformed request or validation failure. Malformed JSON, unknown

        fields, invalid enum values, bad UUIDs, and rule violations (e.g. an

        empty PATCH) all land here. Field-level detail in `Problem.errors`.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: 'Conflict. The request could not be completed due to a conflict
        with the current state of the target resource.

        For example, creating a workspace with a name that already exists.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: 'The referenced resource does not exist.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: 'Unexpected server failure. The response deliberately carries no

        internal detail; correlate via the request id in server logs.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: 'Unauthorized to access the referenced resource.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
