services:
  database:
    image: postgres:18-alpine
    container_name: kizen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # Host 5432 -> Container 5432 (local DB tools / psql access)
    volumes:
      - postgres_data:/var/lib/postgresql
      # Mount directory directly at /docker-entrypoint-initdb.d so postgres automatically executes *.sql files on initial volume creation
      - ./services/api/sql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: kizen-web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/auth/ok || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: kizen-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      PORT: ${PORT}
    ports:
      - "8080:8080" # Backend api exposed outside for development purposes
    depends_on:
      database:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
