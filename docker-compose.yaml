services:
  database:
    image: postgres:17-alpine
    #container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"   #host:container

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/database/sql/migrations/tickets.sql:/docker-entrypoint-initdb.d/001_tickets.sql:ro

    healthcheck:
          test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
          interval: 5s
          timeout: 5s
          retries: 5

    networks:
      - kizen

  ticket-service:
    image: kizen/ticket-service
    env_file:
      - .env

    # letting tilt build this system
    # build:
    #   context: .
    #   dockerfile: infra/docker/ticket-service.Dockerfile

    environment:
      SERVER_PORT: ${TICKET_SERVICE_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "8080:8080" #host:container

    depends_on:
      database:
        condition: service_healthy


volumes:
  postgres_data:

networks:
  kizen:
    name: kizen
