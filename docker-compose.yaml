services:
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - kizen

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    networks:
      - kizen

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/migrations/tickets.sql:/docker-entrypoint-initdb.d/001_tickets.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kizen

  ticket-service:
    image: kizen/ticket-service
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ticket-service.entrypoints=web"
      - "traefik.http.routers.ticket-service.rule=PathPrefix(`/api/tickets`)"
      - "traefik.http.routers.ticket-service.priority=10"
      - "traefik.http.services.ticket-service.loadbalancer.server.port=${TICKET_SERVICE_PORT}"
    environment:
      SERVER_PORT: ${TICKET_SERVICE_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      database:
        condition: service_healthy
    networks:
      - kizen

volumes:
  postgres_data:

networks:
  kizen:
    name: kizen
