services:
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=kizen-internal"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kizen-internal

  web:
    image: kizen/web
    build:
      context: .
      dockerfile: infra/developement/docker/web.Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    environment:
      PORT: "80"
      NODE_ENV: "production"
      AUTH_DATABASE_PATH: "/app/data/auth.db"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      WORKSPACE_SERVICE_URL: "http://workspace-service:${WORKSPACE_SERVICE_PORT}"
    volumes:
      - web_auth_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - kizen-internal

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/migrations/workspaces.sql:/docker-entrypoint-initdb.d/01-workspaces.sql:ro
      - ./sql/migrations/projects.sql:/docker-entrypoint-initdb.d/02-projects.sql:ro
      - ./sql/migrations/tickets.sql:/docker-entrypoint-initdb.d/03-tickets.sql:ro
      - ./sql/migrations/settlements.sql:/docker-entrypoint-initdb.d/04-settlements.sql:ro
      - ./sql/migrations/time_entries.sql:/docker-entrypoint-initdb.d/05-time_entries.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kizen-internal

  # ticket-service:
  #   image: kizen/ticket-service
  #   build:
  #     context: .
  #     dockerfile: infra/docker/ticket-service.Dockerfile
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.ticket-service.entrypoints=web"
  #     - "traefik.http.routers.ticket-service.rule=PathPrefix(`/api/v1/tickets`)"
  #     - "traefik.http.routers.ticket-service.priority=10"
  #     - "traefik.http.services.ticket-service.loadbalancer.server.port=${TICKET_SERVICE_PORT}"
  #   environment:
  #     SERVER_PORT: ${TICKET_SERVICE_PORT}
  #     DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
  #   depends_on:
  #     database:
  #       condition: service_healthy
  #   networks:
  #     - kizen-internal

  workspace-service:
    image: kizen/workspace-service
    build:
      context: .
      dockerfile: infra/developement/docker/workspace-service.Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.workspace-service.entrypoints=web"
      - "traefik.http.routers.workspace-service.rule=PathPrefix(`/api/v1/workspaces`)"
      - "traefik.http.middlewares.workspace-strip.stripprefix.prefixes=/api/v1"
      - "traefik.http.routers.workspace-service.middlewares=workspace-strip"
      - "traefik.http.routers.workspace-service.priority=10"
      - "traefik.http.services.workspace-service.loadbalancer.server.port=${WORKSPACE_SERVICE_PORT}"
    environment:
      WORKSPACE_SERVICE_PORT: ${WORKSPACE_SERVICE_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_JWKS_URL: http://web:80/api/auth/jwks
    depends_on:
      database:
        condition: service_healthy
    networks:
      - kizen-internal

volumes:
  postgres_data:
  web_auth_data:

networks:
  kizen-internal:
    driver: bridge
